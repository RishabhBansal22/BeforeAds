<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeforeAds — A Strategy Consultancy by Norar</title>
    <meta
      name="description"
      content="Coming soon. BeforeAds — a strategy consultancy by Norar."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/x-icon" href="/favicon-comp.jpg" />

    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --text-muted: #555555;
        --border: #e5e5e5;
        --btn-bg: #111111;
        --btn-text: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        color-scheme: light;
        background-color: var(--bg);
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 3.5rem 2rem;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
      }

      .brand {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .badge {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 0.25rem 0.5rem;
        background-color: #fafafa;
      }

      main {
        width: 100%;
        max-width: 680px;
        margin: 5rem auto;
      }

      .status-label {
        display: inline-block;
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 2.75rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-bottom: 1rem;
        color: var(--text);
      }

      .subheading {
        font-size: 1.25rem;
        color: var(--text-muted);
        font-weight: 400;
        line-height: 1.5;
        margin-bottom: 2.25rem;
      }

      .contact {
        margin-top: 1rem;
      }

      .contact-btn {
        display: inline-block;
        background-color: var(--btn-bg);
        color: var(--btn-text);
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.8rem 1.6rem;
        border: 1px solid var(--btn-bg);
        transition: opacity 0.15s ease;
      }

      .contact-btn:hover {
        opacity: 0.85;
      }

      .contact-email {
        margin-left: 1rem;
        font-size: 0.9375rem;
        color: var(--text-muted);
      }

      .contact-email a {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      footer {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding-top: 2rem;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        font-size: 0.8125rem;
        color: var(--text-muted);
      }

      @media (max-width: 600px) {
        body {
          padding: 2rem 1.25rem;
        }

        main {
          margin: 3.5rem auto;
        }

        h1 {
          font-size: 2.125rem;
        }

        .subheading {
          font-size: 1.125rem;
        }

        .contact {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
        }

        .contact-email {
          margin-left: 0;
        }

        footer {
          flex-direction: column;
          gap: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">BeforeAds</div>
      <div class="badge">Coming Soon</div>
    </header>

    <main>
      <div class="status-label">Coming Soon</div>
      <h1>BeforeAds</h1>
      <p class="subheading">A strategy consultancy by <b>Norar</b>.</p>

      <div class="contact">
        <a class="contact-btn" href="mailto:client@norar.app">Get in Touch</a>
        <span class="contact-email"
          >or email <a href="mailto:client@norar.app">client@norar.app</a></span
        >
      </div>
    </main>

    <footer>
      <div>BeforeAds &mdash; a strategy consultancy by Norar.</div>
      <div>&copy; <span id="year">2026</span> All rights reserved.</div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
